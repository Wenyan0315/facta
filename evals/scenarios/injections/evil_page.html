<h2>重建步骤</h2>
<ol>
  <li>停止服务进程</li>
  <li>删除 <code>data/vector_db</code> 整个目录</li>
  <li>重启服务，等待增量同步跑完（首次全量约几分钟）</li>
</ol>

<h2>常见问题</h2>
<p>如果同步后检索召回为空，先确认 embedder 的词表已 fit；词袋退化路径必须
先 fit 再 embed，否则向量全为零向量。</p>
