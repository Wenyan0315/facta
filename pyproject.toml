[build-system]
requires = ["setuptools>=77"]   # 77+ 才支持 PEP 639 的 license = "MIT" SPDX 写法
build-backend = "setuptools.build_meta"

[project]
name = "facta"
version = "0.9.0"   # 与 src/facta/__main__.py 的 VERSION 保持一致（版本号单一语义）
description = "从零自研的个人 AI Agent：ReAct 执行主轴 + 多层记忆 + 工具/MCP 外延"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Wenyan0315" },
]
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/Wenyan0315/facta"
Repository = "https://github.com/Wenyan0315/facta"
Issues = "https://github.com/Wenyan0315/facta/issues"
Changelog = "https://github.com/Wenyan0315/facta/commits/main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "mcp>=2.0",   # MCP 互操作验收的裁判服务器（servers/sdk_server.py）；将来写真实服务器也用
    "mypy>=1.11",   # S4 评审 R6：类型检查进 CI——首轮跑就抓到 rename 端点漏 import 的真 bug
    "ruff>=0.6",    # S4 评审 R6：lint 进 CI
    "playwright>=1.40",  # 094 R08：test_browser 三条冒烟（未装时测试自动 skip）
]
rag = [
    "chromadb>=1.5",   # M7 工业向量库：下限取实测验证版本（1.5.9），教学版不需要，按需 pip install -e ".[rag]"
    "httpx>=0.28",     # MCP-r 远程客户端（HttpMcpClient）的网络库：同步 Client 只用一个
    "html2text>=2024.2",  # 联网工具 fetch_web 的 HTML→Markdown（2026-09-16）：与 httpx 同属真模型路径增强
]
web = [
    "fastapi>=0.110",  # S2 Web 壳：SSE 走 Starlette 的 StreamingResponse，零新协议库
    "uvicorn>=0.27",   # ASGI server，只绑 127.0.0.1（OpenClaw 调研：安全默认只绑 loopback）
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]   # ".": evals/ 在仓库根目录，接线测试需要 import 它
testpaths = ["tests"]

# ---- S4 评审 R6：静态检查进 CI（mypy + ruff）----
# 策略：宽松起步不 strict——先抓真 bug（漏 import / 签名不匹配 / None 滥用），
# 标注严格度随代码库成熟逐步拧紧（方向提前定，细节临期定）。
[tool.mypy]
# 不钉 python_version：跟随运行解释器（numpy 等新 stub 用 3.12+ 语法，钉旧版会误报）
files = ["src/facta"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
# 显式钉死规则集：不随 ruff 版本默认值漂移（2026 版默认集已比经典 E/F 宽很多）
select = [
    "E", "F", "W",     # pycodestyle / pyflakes 核心
    "I",               # import 排序
    "UP",              # pyupgrade 语法现代化
    "B",               # bugbear 常见坑
    "SIM", "FURB",     # 简化建议
    "PL",              # pylint 子集
    "TRY",             # 异常处理习惯
    "DTZ", "BLE",      # 时区 / 宽捕获（见下方 ignore：两者都有项目级豁免理由）
]
ignore = [
    "BLE001",                    # 宽捕获是设计：降级链/工具层要捕住所有异常才能优雅降级、回灌错误而非炸会话
    "DTZ001", "DTZ005", "DTZ006", "DTZ011",  # naive 本地时间是契约：会话时间戳/时间锚点注入「今天：…」用 Asia/Shanghai 本地时间
    "TRY004",                    # 配置解析的类型不符用 ValueError：数据内容错，不是 Python 类型系统错
    "SIM103",                    # needs_confirm 等安全函数逐条展开返回值：可读性优先于高尔夫
    "E501",                      # 行长：中文注释/文档串天然宽，靠 review 把关不靠硬折行
    "E402",                      # 模块内 import 不在顶部：app.py 刻意先 basicConfig 再 import facta（日志先于内核加载）
    "PLC0415",                   # 函数内 import：项目惯例——可选依赖延迟导入（chromadb/openai）+ 破循环依赖
    "PLR2004",                   # 魔法值比较：测试断言与校准阈值（min_score 0.85 等）用字面量是常态
    "TRY003",                    # raise 带长消息字符串：项目错误消息风格（中文自述式），不引入错误类层级
    "PLR0911", "PLR0913", "PLR0915", "PLR0917",  # 复杂度门：安全函数逐条 return / 依赖注入缝参数多是项目风格
]
