<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>记忆面板 · Facta</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" crossorigin src="/fw/assets/memory.js"></script>
  <link rel="modulepreload" crossorigin href="/fw/assets/hooks.module.js">
</head>
<body>
  <aside id="sidebar">
    <div class="sidebar-head">
      <button id="new-session" onclick="location.href='/'">← 返回对话</button>
      <span class="muted" style="font-size:12px;">agent 跨会话记住的记忆（固化管线产物：项目级三桶 + 用户级）</span>
    </div>
    <ul id="session-list"><li class="muted">记忆面板</li></ul>
  </aside>

  <main id="chat">
    <div id="messages">
      <h2 class="tasks-title">记忆面板</h2>
      <!-- ADR 118 §5：项目设置（记忆归属双模式切换）并入 /tasks 页折叠区块，此处只留动线链接 -->
      <p class="muted" style="font-size:13px;">
        项目级记忆的<strong>归属模式</strong>（集中式 ↔ 就地式）在
        <a href="/tasks">任务页</a>底部的「项目设置」区块切换。
      </p>
      <div id="memory-root"></div>
    </div>
  </main>

</body>
</html>
