<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Agent</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside id="sidebar">
    <div class="sidebar-head">
      <button id="new-session" title="新会话">＋ 新会话</button>
      <a href="/tasks" class="nav-link">任务视图</a>
      <a href="/memory" class="nav-link">记忆面板</a>
      <a href="/graph" class="nav-link">知识图谱</a>
      <a href="/notes" class="nav-link">知识语料</a>
    </div>
    <ul id="session-list"><li class="muted">加载中…</li></ul>
    <div id="todo-panel">
      <div class="todo-head">待办</div>
      <ul id="todo-list"></ul>
      <form id="todo-form">
        <input id="todo-input" type="text" placeholder="添加待办…" autocomplete="off">
      </form>
    </div>
  </aside>

  <main id="chat">
    <div id="messages"></div>
    <form id="composer">
      <textarea id="input" rows="2" placeholder="发消息给 agent…（Enter 发送，Shift+Enter 换行）"></textarea>
      <div class="composer-actions">
        <button type="button" id="cancel" class="hidden">取消</button>
        <button type="submit" id="send">发送</button>
      </div>
    </form>
  </main>

  <!-- L2 确认弹窗（S4b）：高危操作裁决，命令全文展示，批准/拒绝落后端 -->
  <div id="confirm-modal" class="hidden">
    <div class="confirm-box">
      <div class="confirm-title">⚠️ agent 请求执行高危操作</div>
      <div id="confirm-tool" class="confirm-tool"></div>
      <pre id="confirm-args" class="confirm-args"></pre>
      <div class="confirm-actions">
        <button id="confirm-reject" type="button">拒绝</button>
        <button id="confirm-approve" type="button">批准执行</button>
      </div>
    </div>
  </div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
