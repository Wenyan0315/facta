<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务视图 · Facta</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside id="sidebar">
    <div class="sidebar-head">
      <button id="new-session" onclick="location.href='/'">← 返回对话</button>
      <span class="muted" style="font-size:12px;">委派长期任务 / 队列 / 账单 / 确认 / 项目设置（ADR 118）。任务清单持久在 data/tasks；Run 明细只活在本进程</span>
    </div>
    <ul id="session-list"><li class="muted">任务视图</li></ul>
  </aside>

  <main id="chat">
    <div id="messages">
      <h2 class="tasks-title">任务</h2>
      <!-- FW 站 v2：容器空着，内容由 Preact 状态驱动渲染（对照 v1 的 innerHTML 拼接） -->
      <div id="tasks-app"></div>
    </div>
  </main>

  <script type="module" src="/src/tasks/main.jsx"></script>
</body>
</html>
